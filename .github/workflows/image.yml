# Reusable: build one image natively per architecture (amd64 on x86 runners, arm64 on ARM runners), push each by digest,
# then publish ONE manifest list tagged `main` (moves; the server pulls it) and `sha-<commit>` (immutable).
# Called by deploy-backend.yml and deploy-frontend.yml. Fails if either architecture is missing from the manifest.
name: Build multi-arch image

on:
  workflow_call:
    inputs:
      name:
        description: Short name, used for artifact and cache names (backend, frontend)
        required: true
        type: string
      image:
        description: Image repository, e.g. ghcr.io/n0xum/structify-backend
        required: true
        type: string
      context:
        required: true
        type: string
      file:
        description: Dockerfile path relative to the repository root
        required: true
        type: string
      build-args:
        description: Newline separated KEY=value build arguments (no secrets)
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: Digest of the published manifest list
        value: ${{ jobs.manifest.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.name }}-${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}-${{ matrix.pair }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ inputs.name }}-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish ${{ inputs.name }} manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify the manifest list
        id: merge
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          digests=(*)
          [ "${#digests[@]}" = 2 ] || { echo "expected exactly one digest per architecture, got: ${digests[*]}" >&2; exit 1; }
          sources=(); for d in "${digests[@]}"; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create -t "$IMAGE:main" -t "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          out=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA")
          for arch in linux/amd64 linux/arm64; do
            grep -q "$arch" <<<"$out" || { echo "manifest list lacks $arch" >&2; echo "$out" >&2; exit 1; }
          done
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          { echo "### $IMAGE"; echo "- tags: \`main\`, \`sha-$GITHUB_SHA\`"; echo "- index digest: \`$digest\`"; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
