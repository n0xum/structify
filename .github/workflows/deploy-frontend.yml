# Frontend (Next.js static export served by nginx): build the image for amd64 and arm64, publish one manifest, then ask
# the deploy gate on the host to swap. NEXT_PUBLIC_API_URL is baked into the static bundle at build time, so it is set here.
# It is the LIVE domain (alexanderkruska.dev): the previous workflow used the retired alexander-kruska.dev, which no longer
# resolves, so the deployed frontend could not reach its API. The repository variable NEXT_PUBLIC_API_URL is deliberately
# not used (it points to an old dot domain).
# The deploy job only runs when the repository variable STRUCTIFY_DEPLOY_ENABLED is `true`.
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "web/nextjs/**"
      - ".github/workflows/deploy-frontend.yml"
      - ".github/workflows/image.yml"
      - ".github/actions/**"
      - "scripts/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  image:
    name: image
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      name: frontend
      image: ghcr.io/n0xum/structify-frontend
      context: web/nextjs
      file: web/nextjs/Dockerfile
      build-args: |
        NEXT_PUBLIC_API_URL=https://api-structify.alexanderkruska.dev

  deploy:
    name: deploy
    needs: image
    if: github.ref == 'refs/heads/main' && vars.STRUCTIFY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment is declared here, in the job that runs the steps: its secret SSH_PRIVATE_KEY and its variables are only
    # visible to such a job (see .github/actions/gate-deploy/action.yml).
    environment:
      name: production
      url: https://structify.alexanderkruska.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Deploy through the gate
        uses: ./.github/actions/gate-deploy
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ vars.SSH_HOST }}
          port: ${{ vars.SSH_PORT }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          note: "frontend image index ${{ needs.image.outputs.digest }}"
