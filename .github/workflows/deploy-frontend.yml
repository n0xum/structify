# Deploy des Next.js-Frontends (statischer Export -> nginx) auf den VPS.
#
# Image-Modell: gebaut wird in der CI auf einem nativen arm64-Runner
# (ubuntu-24.04-arm), das fertige Image landet in GHCR, der VPS zieht es nur.
#
# NEXT_PUBLIC_API_URL wird zur Build-Zeit ins statische Bundle eingebacken und
# ist deshalb hier gesetzt. Bewusst hart auf die Bindestrich-Domain
# (api-structify…) – die Repo-Variable NEXT_PUBLIC_API_URL zeigt auf eine
# veraltete Punkt-Domain (api.structify…) und darf hier nicht verwendet werden.
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "web/nextjs/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/n0xum/structify-frontend
  SERVICE: structify-frontend
  COMPOSE_DIR: /srv/web/structify
  API_URL: https://api-structify.alexander-kruska.dev
  SSH_OPTS: -o ServerAliveInterval=20 -o ServerAliveCountMax=15 -o TCPKeepAlive=yes

jobs:
  # ── Bauen und ins Registry pushen (nativ arm64) ───────────────────────────
  build-and-push:
    name: build & push
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Bauen und pushen (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: web/nextjs
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Auf dem VPS nur ziehen und tauschen ───────────────────────────────────
  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH-Zugang einrichten
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Image ziehen und Container tauschen
        env:
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "COMPOSE_DIR='$COMPOSE_DIR' SERVICE='$SERVICE' bash -euo pipefail -s" <<'ENDSSH'
            cd "$COMPOSE_DIR"
            docker compose pull "$SERVICE"
            docker compose up -d "$SERVICE"
          ENDSSH

      - name: Healthcheck
        env:
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "COMPOSE_DIR='$COMPOSE_DIR' SERVICE='$SERVICE' bash -euo pipefail -s" <<'ENDSSH'
            cd "$COMPOSE_DIR"
            for attempt in $(seq 1 24); do
              if docker compose ps "$SERVICE" --format json | grep -q '"healthy"'; then
                echo "Container ist gesund (nach $((attempt * 5))s)"
                exit 0
              fi
              echo "warte auf gesunden Zustand … ($attempt/24)"
              sleep 5
            done
            echo "FEHLER: Container wird nicht gesund." >&2
            docker compose logs --tail=100 "$SERVICE" >&2
            exit 1
          ENDSSH

      - name: Verwaiste Images entfernen
        if: success()
        env:
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_OPTS "$SSH_USER@$SSH_HOST" "docker image prune -f"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key
