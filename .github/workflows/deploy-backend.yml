# Backend (Go): test, build the image for amd64 and arm64, publish one manifest, then ask the deploy gate on the host to swap.
# The build and manifest logic is shared with the frontend (image.yml); the gate call is gate-deploy.yml.
# The deploy job only runs when the repository variable STRUCTIFY_DEPLOY_ENABLED is `true`, so the images can be built
# before the stack on the server exists and has been tested.
name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/image.yml"
      - ".github/workflows/gate-deploy.yml"
      - "scripts/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # ── Tests as a gate before the build ──────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true
      - run: go test ./...

  image:
    name: image
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      name: backend
      image: ghcr.io/n0xum/structify-backend
      context: .
      file: Dockerfile

  deploy:
    name: deploy
    needs: image
    if: github.ref == 'refs/heads/main' && vars.STRUCTIFY_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/gate-deploy.yml
    with:
      url: https://api-structify.alexanderkruska.dev/health
      note: "backend image index ${{ needs.image.outputs.digest }}"
