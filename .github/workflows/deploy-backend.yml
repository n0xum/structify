# Backend (Go): test, build the image for amd64 and arm64, publish one manifest, then ask the deploy gate on the host to swap.
# The build and manifest logic is shared with the frontend (image.yml); the gate call is gate-deploy.yml.
# The deploy job only runs when the repository variable STRUCTIFY_DEPLOY_ENABLED is `true`, so the images can be built
# before the stack on the server exists and has been tested.
name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/image.yml"
      - ".github/actions/**"
      - "scripts/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # ── Tests as a gate before the build ──────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go test ./...

  image:
    name: image
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      name: backend
      image: ghcr.io/n0xum/structify-backend
      context: .
      file: Dockerfile

  deploy:
    name: deploy
    needs: image
    if: github.ref == 'refs/heads/main' && vars.STRUCTIFY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment is declared here, in the job that runs the steps: its secret SSH_PRIVATE_KEY and its variables are only
    # visible to such a job (see .github/actions/gate-deploy/action.yml).
    environment:
      name: production
      url: https://api-structify.alexanderkruska.dev/health
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Deploy through the gate
        uses: ./.github/actions/gate-deploy
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ vars.SSH_HOST }}
          port: ${{ vars.SSH_PORT }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          note: "backend image index ${{ needs.image.outputs.digest }}"
